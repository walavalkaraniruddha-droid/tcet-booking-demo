<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMAX Booking</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #f1f1f1; margin: 0; padding: 0; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 420px; background: #141414; min-height: 100vh; padding: 20px; box-sizing: border-box; border-left: 1px solid #333; border-right: 1px solid #333; }
        
        .header { margin-bottom: 25px; text-align: center; }
        .subtitle { color: #e50914; font-size: 0.75rem; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; }
        .title { font-size: 1.8rem; font-weight: 900; margin: 5px 0; letter-spacing: 1px; text-transform: uppercase; }
        .time-info { color: #888; font-size: 0.85rem; }

        .screen-curve { width: 100%; height: 25px; background: linear-gradient(to bottom, #333, transparent); border-top: 2px solid #555; border-top-left-radius: 50%; border-top-right-radius: 50%; margin: 20px 0 15px 0; text-align: center; font-size: 0.6rem; color: #777; letter-spacing: 3px; padding-top: 5px; }

        .seat-grid-container { display: flex; margin-bottom: 25px; justify-content: center; }
        .row-labels { display: flex; flex-direction: column; gap: 8px; margin-right: 12px; margin-top: 2px; }
        .row-label { height: 22px; font-size: 0.7rem; font-weight: bold; color: #888; display: flex; align-items: center; }
        
        .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
        .seat { width: 22px; height: 22px; border-radius: 4px; border: none; font-size: 0.55rem; font-weight: bold; cursor: pointer; transition: 0.2s; color: white; display: flex; align-items: center; justify-content: center; background: #333; }
        
        .seat.available:hover { background: #555; }
        .seat.pending { background: #f59e0b; cursor: not-allowed; color: black; }
        .seat.booked { background: #1a1a1a; cursor: not-allowed; color: #333; opacity: 0.5; }
        .seat.selected { background: #e50914; box-shadow: 0 0 10px rgba(229, 9, 20, 0.6); transform: scale(1.15); }

        .legend { display: flex; justify-content: space-between; font-size: 0.7rem; color: #aaa; margin-bottom: 30px; padding: 0 10px; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .legend-box { width: 12px; height: 12px; border-radius: 2px; }

        .checkout-bar { background: #1f1f1f; border-radius: 12px; padding: 15px; margin-bottom: 20px; border: 1px solid #333; }
        .checkout-flex { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .checkout-label { font-size: 0.7rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .checkout-value { font-size: 1.1rem; font-weight: bold; color: white; }
        .btn { width: 100%; padding: 14px; background: #333; color: #888; border: none; border-radius: 8px; font-weight: bold; cursor: not-allowed; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        .btn.active { background: #e50914; color: white; cursor: pointer; }
        .btn.active:hover { background: #b9090b; }

        /* Hidden Terminal as requested */
        .monitor-card { display: none; }

        /* Simulated Payment Modal CSS */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(5px); }
        .modal-content { background: #141414; padding: 30px; border-radius: 16px; width: 85%; max-width: 350px; text-align: center; border: 1px solid #333; }
        
        .spinner { border: 4px solid #333; border-top: 4px solid #e50914; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin: 0 auto 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .success-icon { background: #10b981; color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; margin: 0 auto 15px auto; }
        
        .receipt-box { background: #1f1f1f; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-bottom: 20px; text-align: left; }
        .receipt-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .receipt-label { color: #888; font-size: 0.85rem; }
        .receipt-value { font-weight: bold; font-size: 0.9rem; color: white; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="subtitle">IMAX EXCLUSIVE</div>
        <div class="title">Dune: Part Two</div>
        <div class="time-info">09:30 PM • Screen 4</div>
    </div>

    <div class="screen-curve">IMAX SCREEN</div>

    <div class="seat-grid-container">
        <div class="row-labels" id="row-labels"></div>
        <div class="grid" id="seat-map"></div>
    </div>

    <div class="legend">
        <div class="legend-item"><div class="legend-box" style="background: #333;"></div> Available</div>
        <div class="legend-item"><div class="legend-box" style="background: #e50914;"></div> Selected</div>
        <div class="legend-item"><div class="legend-box" style="background: #f59e0b;"></div> Held</div>
        <div class="legend-item"><div class="legend-box" style="background: #1a1a1a;"></div> Booked</div>
    </div>

    <div class="checkout-bar">
        <div class="checkout-flex">
            <div>
                <div class="checkout-label">Selected Seat</div>
                <div class="checkout-value" id="selected-seat-label">--</div>
            </div>
            <div style="text-align: right;">
                <div class="checkout-label">Total Amount</div>
                <div class="checkout-value" id="price-label">₹ 0</div>
            </div>
        </div>
        <button class="btn" id="proceedBtn" onclick="initiatePaymentFlow()">Proceed to Payment</button>
    </div>

    <!-- Hidden from UI, but exists in code -->
    <div class="monitor-card"></div>
</div>

<!-- Simulated Payment Modal -->
<div class="modal" id="paymentModal">
    <div class="modal-content">
        <!-- View 1: Processing Spinner & Timer -->
        <div id="processingView">
            <!-- The 5 Minute Timer -->
            <div id="paymentTimer" style="color: #e50914; font-weight: 900; font-size: 1.8rem; letter-spacing: 2px; margin-bottom: 20px;">05:00</div>
            
            <div class="spinner"></div>
            <h3 style="margin: 0 0 10px 0; color: white;">Processing Payment...</h3>
            <p style="color: #888; font-size: 0.85rem; margin: 0;">Securing your seat in the database.</p>
        </div>

        <!-- View 2: Success Receipt -->
        <div id="successView" style="display: none;">
            <div class="success-icon">✓</div>
            <h3 style="margin: 0 0 5px 0; color: white;">Booking Confirmed</h3>
            <p style="color: #888; font-size: 0.85rem; margin: 0 0 20px 0;">Enjoy the movie!</p>
            
            <div class="receipt-box">
                <div class="receipt-row">
                    <span class="receipt-label">Seat Number</span>
                    <span class="receipt-value" id="receiptSeat">--</span>
                </div>
                <div class="receipt-row">
                    <span class="receipt-label">Amount Paid</span>
                    <span class="receipt-value">₹ 250.00</span>
                </div>
                <div class="receipt-row">
                    <span class="receipt-label">Status</span>
                    <span class="receipt-value" style="color: #10b981;">SUCCESS</span>
                </div>
            </div>
            
            <button class="btn active" onclick="location.reload()">Return to Home</button>
        </div>
    </div>
</div>

<script>
    let currentSelectedId = null;
    let timeLeft = 300; 
    let timerInterval;

    async function loadSeats() {
        try {
            const res = await fetch('/api/seats');
            const seats = await res.json();
            
            const map = document.getElementById('seat-map');
            const labels = document.getElementById('row-labels');
            map.innerHTML = '';
            labels.innerHTML = '';

            const rowChars = ['A','B','C','D','E','F','G','H'];
            rowChars.forEach(char => {
                labels.innerHTML += `<div class="row-label">${char}</div>`;
            });

            seats.forEach(seat => {
                const btn = document.createElement('button');
                btn.className = `seat ${seat.status.toLowerCase()}`;
                btn.innerText = ((seat.id - 1) % 10) + 1; 

                if(seat.status === 'AVAILABLE') {
                    btn.onclick = () => selectSeat(btn, seat.id);
                } else if(seat.status === 'PENDING') {
                    btn.innerText = "⏳";
                    btn.disabled = true;
                } else {
                    btn.innerText = "X";
                    btn.disabled = true;
                }
                map.appendChild(btn);
            });
        } catch (error) {
            console.error("Database connection failed");
        }
    }

    function selectSeat(btnElement, id) {
        document.querySelectorAll('.seat.selected').forEach(el => {
            el.classList.remove('selected');
            el.classList.add('available');
        });
        
        btnElement.classList.remove('available');
        btnElement.classList.add('selected');
        currentSelectedId = id;
        
        const rowChar = String.fromCharCode(65 + Math.floor((id-1)/10));
        const colNum = ((id - 1) % 10) + 1;
        
        document.getElementById('selected-seat-label').innerText = `${rowChar}${colNum}`;
        document.getElementById('price-label').innerText = `₹ 250`;
        
        const proceedBtn = document.getElementById('proceedBtn');
        proceedBtn.classList.add('active');
        proceedBtn.disabled = false;
    }

    function startTimer() {
        timeLeft = 300; // 5 minutes
        clearInterval(timerInterval);
        
        timerInterval = setInterval(async () => {
            timeLeft--;
            let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            let s = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('paymentTimer').innerText = `${m}:${s}`;
            
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                await fetch('/release-seat', { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ seatId: currentSelectedId }) 
                });
                alert("Session Expired! The seat has been released.");
                location.reload();
            }
        }, 1000);
    }

    async function initiatePaymentFlow() {
        if(!currentSelectedId) return;
        
        const proceedBtn = document.getElementById('proceedBtn');
        proceedBtn.innerText = "Locking Seat...";
        proceedBtn.classList.remove('active');
        
        try {
            const res = await fetch('/hold-seat', { 
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ seatId: currentSelectedId })
            });
            const data = await res.json();

            if (data.success) {
                document.getElementById('paymentModal').style.display = 'flex';
                document.getElementById('processingView').style.display = 'block';
                document.getElementById('successView').style.display = 'none';

                startTimer();

                // 5-second simulated payment so everyone can see the timer ticking down
                setTimeout(() => {
                    finalizeSimulatedPayment();
                }, 5000);

            } else {
                alert("Race Condition Prevented! " + data.message);
                location.reload(); 
            }
        } catch (err) {
            console.error("Network failure");
        }
    }

    async function finalizeSimulatedPayment() {
        try {
            const res = await fetch('/book-seat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ seatId: currentSelectedId, name: "Demo User" })
            });
            const data = await res.json();

            if(data.success) {
                clearInterval(timerInterval); // Stop the timer once paid
                
                const rowChar = String.fromCharCode(65 + Math.floor((currentSelectedId-1)/10));
                const colNum = ((currentSelectedId - 1) % 10) + 1;
                document.getElementById('receiptSeat').innerText = `${rowChar}${colNum}`;

                document.getElementById('processingView').style.display = 'none';
                document.getElementById('successView').style.display = 'block';
            } else {
                alert("Error: " + data.message);
                location.reload();
            }
        } catch (err) {
            alert("Server Error");
            location.reload();
        }
    }

    window.onload = loadSeats;
</script>
</body>
</html>
