<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextGen Cinemas</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b0f19; color: white; text-align: center; margin: 0; padding: 20px; overflow-x: hidden; }
        h2 { text-transform: uppercase; letter-spacing: 2px; color: #e2e8f0; font-size: 1.5rem; margin-bottom: 30px; }
        
        /* Glowing Screen */
        .screen-container { perspective: 400px; margin-bottom: 40px; }
        .screen { width: 100%; max-width: 400px; height: 60px; margin: 0 auto; background: linear-gradient(to bottom, #38bdf844, transparent); border-top: 4px solid #38bdf8; border-top-left-radius: 50%; border-top-right-radius: 50%; box-shadow: 0 -15px 40px rgba(56, 189, 248, 0.4); transform: rotateX(-10deg); }
        .screen-text { color: #64748b; font-size: 0.8rem; margin-top: 10px; letter-spacing: 3px; }

        /* Seat Layout */
        .seating-area { display: flex; flex-direction: column; gap: 15px; align-items: center; margin-bottom: 40px; }
        .seat-row { display: flex; gap: 12px; }
        .seat { width: 35px; height: 35px; border-radius: 8px; border: none; font-size: 0.6rem; font-weight: bold; transition: all 0.3s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        
        /* Seat Status Colors */
        .seat.booked { background: #475569; color: #94a3b8; cursor: not-allowed; opacity: 0.6; }
        .seat.dummy-available { background: #e2e8f0; color: #0b0f19; cursor: pointer; }
        .seat.dummy-available:hover { background: #cbd5e1; transform: scale(1.1); }
        
        /* The Race Target Seat */
        .seat.target-seat { background: #fbbf24; color: #000; cursor: pointer; box-shadow: 0 0 15px rgba(251, 191, 36, 0.6); animation: pulse 2s infinite; }
        .seat.target-seat:hover { transform: scale(1.1); background: #f59e0b; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(251, 191, 36, 0); }
            100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); }
        }

        /* Glassmorphism Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 15, 25, 0.85); align-items: center; justify-content: center; backdrop-filter: blur(8px); z-index: 100; }
        .modal-content { background: rgba(30, 41, 59, 0.9); padding: 30px; border-radius: 20px; width: 85%; max-width: 350px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .modal-content h3 { margin-top: 0; color: #f8fafc; }
        
        input { width: 85%; padding: 14px; margin: 10px 0; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: white; outline: none; transition: border 0.3s; }
        input:focus { border: 1px solid #38bdf8; }
        
        .btn { background: linear-gradient(135deg, #2563eb, #3b82f6); color: white; padding: 14px 24px; border: none; border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; width: 100%; margin-top: 20px; transition: opacity 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { background: #475569; cursor: not-allowed; }
        
        .qr-img { width: 180px; border-radius: 16px; margin: 15px 0; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 2px solid #334155; }
        #timer { color: #ef4444; font-weight: 900; font-size: 1.4rem; letter-spacing: 1px; display: block; margin-bottom: 15px; }
        
        /* Legend */
        .legend { display: flex; justify-content: center; gap: 20px; margin-top: 20px; font-size: 0.8rem; color: #94a3b8; }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .legend-box { width: 15px; height: 15px; border-radius: 4px; }
    </style>
</head>
<body>

    <h2>NextGen Cinemas</h2>
    
    <div class="screen-container">
        <div class="screen"></div>
        <div class="screen-text">SCREEN THIS WAY</div>
    </div>
    
    <div class="seating-area">
        <div class="seat-row">
            <button class="seat booked">X</button><button class="seat booked">X</button><button class="seat dummy-available"></button><button class="seat dummy-available"></button><button class="seat booked">X</button>
        </div>
        <div class="seat-row">
            <button class="seat dummy-available"></button><button class="seat dummy-available"></button><button class="seat booked">X</button><button class="seat dummy-available"></button><button class="seat booked">X</button>
        </div>
        <div class="seat-row">
            <button class="seat booked">X</button>
            <button class="seat dummy-available"></button>
            <!-- THE TARGET SEAT -->
            <button class="seat target-seat" id="vipSeat" onclick="openDetailsModal()">VIP</button>
            <button class="seat dummy-available"></button>
            <button class="seat booked">X</button>
        </div>
        <div class="seat-row">
            <button class="seat booked">X</button><button class="seat booked">X</button><button class="seat dummy-available"></button><button class="seat booked">X</button><button class="seat dummy-available"></button>
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><div class="legend-box" style="background: #e2e8f0;"></div> Available</div>
        <div class="legend-item"><div class="legend-box" style="background: #475569;"></div> Booked</div>
        <div class="legend-item"><div class="legend-box" style="background: #fbbf24;"></div> Premium</div>
    </div>

    <!-- Details Modal -->
    <div class="modal" id="detailsModal">
        <div class="modal-content">
            <h3>Complete Booking</h3>
            <span id="timer">05:00</span>
            <input type="text" id="userName" placeholder="Full Name (e.g. Aniruddha)" required autocomplete="off">
            <input type="tel" id="userPhone" placeholder="Mobile Number" required autocomplete="off">
            <!-- IMPORTANT: Passes 'event' to the function to disable the button while loading -->
            <button class="btn" onclick="openPaymentModal(event)">Proceed to Payment</button>
        </div>
    </div>

    <!-- Payment Modal (REAL UPI LINK) -->
    <div class="modal" id="paymentModal">
        <div class="modal-content">
            <h3>Scan or Tap to Pay ₹5</h3>
            
            <!-- THE REAL DEEP LINK -->
            <a href="upi://pay?pa=walavalkaraniruddha@okaxis&pn=Aniruddha&am=5.00&cu=INR" target="_blank">
                <img src="WhatsApp Image 2026-09-09 at 5.33.54 PM.jpeg" alt="QR Code" class="qr-img">
            </a>
            
            <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 0;">Tap image to open GPay. After paying, click Verify.</p>
            <button class="btn" id="verifyBtn" onclick="processBackendPayment()">Verify & Complete</button>
            <p id="message" style="margin-top: 15px; font-weight: bold; font-size: 1.1rem;"></p>
        </div>
    </div>

    <script>
        let timeLeft = 300; 
        let timerInterval;

        function startTimer() {
            timerInterval = setInterval(async () => {
                timeLeft--;
                let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
                let s = (timeLeft % 60).toString().padStart(2, '0');
                document.getElementById('timer').innerText = `${m}:${s}`;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    // Tell server to un-lock the seat since time ran out
                    await fetch('/release-seat', { method: 'POST' });
                    alert("Time expired! Your seat has been released.");
                    location.reload();
                }
            }, 1000);
        }

        function openDetailsModal() {
            document.getElementById('detailsModal').style.display = 'flex';
            if(!timerInterval) startTimer();
        }

        async function openPaymentModal(event) {
            const name = document.getElementById('userName').value;
            if(!name) return alert('Please enter your name');

            const btn = event.target;
            btn.innerText = "Checking Seat Availability...";
            btn.disabled = true;

            // Ask server to hold the seat BEFORE showing QR
            try {
                const res = await fetch('/hold-seat', { method: 'POST' });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('detailsModal').style.display = 'none';
                    document.getElementById('paymentModal').style.display = 'flex';
                } else {
                    alert("Too late! " + data.message);
                    location.reload(); // Kick them back to the main screen
                }
            } catch (err) {
                alert("Server error");
                btn.innerText = "Proceed to Payment";
                btn.disabled = false;
            }
        }

        async function processBackendPayment() {
            const btn = document.getElementById('verifyBtn');
            const msg = document.getElementById('message');
            btn.innerText = "Verifying on Server...";
            btn.disabled = true;

            try {
                const res = await fetch('/book-seat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ name: document.getElementById('userName').value })
                });
                const data = await res.json();

                if(data.success) {
                    msg.style.color = "#22c55e"; // Green
                    msg.innerText = "✅ " + data.message;
                    setTimeout(() => location.reload(), 4000);
                } else {
                    msg.style.color = "#ef4444"; // Red
                    msg.innerText = "❌ " + data.message;
                    btn.innerText = "Booking Closed";
                }
            } catch (err) {
                msg.style.color = "#ef4444";
                msg.innerText = "Server Error. Try again.";
            }
        }
    </script>
</body>
</html>
