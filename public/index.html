<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextGen Cinemas</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b0f19; color: white; text-align: center; margin: 0; padding: 20px; overflow-x: hidden; }
        h2 { text-transform: uppercase; letter-spacing: 2px; color: #e2e8f0; font-size: 1.5rem; margin-bottom: 30px; }
        
        /* Glowing Screen */
        .screen-container { perspective: 400px; margin-bottom: 40px; }
        .screen { width: 100%; max-width: 400px; height: 60px; margin: 0 auto; background: linear-gradient(to bottom, #38bdf844, transparent); border-top: 4px solid #38bdf8; border-top-left-radius: 50%; border-top-right-radius: 50%; box-shadow: 0 -15px 40px rgba(56, 189, 248, 0.4); transform: rotateX(-10deg); }
        .screen-text { color: #64748b; font-size: 0.8rem; margin-top: 10px; letter-spacing: 3px; }

        /* Dynamic Database Grid */
        .seating-area { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; justify-content: center; max-width: 250px; margin: 0 auto 40px auto; }
        .seat { width: 45px; height: 45px; border-radius: 8px; border: none; font-size: 0.9rem; font-weight: bold; transition: all 0.3s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        
        /* Dynamic Status Colors */
        .seat.available { background: #e2e8f0; color: #0b0f19; cursor: pointer; }
        .seat.available:hover { background: #cbd5e1; transform: scale(1.1); }
        .seat.booked { background: #475569; color: #94a3b8; cursor: not-allowed; opacity: 0.6; }
        .seat.pending { background: #fbbf24; color: #000; cursor: not-allowed; opacity: 0.8; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(251, 191, 36, 0); }
            100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); }
        }

        /* Glassmorphism Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 15, 25, 0.85); align-items: center; justify-content: center; backdrop-filter: blur(8px); z-index: 100; }
        .modal-content { background: rgba(30, 41, 59, 0.9); padding: 30px; border-radius: 20px; width: 85%; max-width: 350px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .modal-content h3 { margin-top: 0; color: #f8fafc; }
        
        input { width: 85%; padding: 14px; margin: 10px 0; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: white; outline: none; }
        
        .btn { background: linear-gradient(135deg, #2563eb, #3b82f6); color: white; padding: 14px 24px; border: none; border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; width: 100%; margin-top: 20px; text-transform: uppercase; }
        .btn:disabled { background: #475569; cursor: not-allowed; }
        
        .qr-img { width: 180px; border-radius: 16px; margin: 15px 0; border: 2px solid #334155; }
        #timer { color: #ef4444; font-weight: 900; font-size: 1.4rem; display: block; margin-bottom: 15px; }
        
        /* Legend */
        .legend { display: flex; justify-content: center; gap: 20px; margin-top: 20px; font-size: 0.8rem; color: #94a3b8; }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .legend-box { width: 15px; height: 15px; border-radius: 4px; }
    </style>
</head>
<body>

    <h2>NextGen Cinemas</h2>
    
    <div class="screen-container">
        <div class="screen"></div>
        <div class="screen-text">SCREEN THIS WAY</div>
    </div>
    
    <!-- Empty Container to be filled dynamically by the Database -->
    <div class="seating-area" id="seat-map">
        <p style="grid-column: span 4; color: #94a3b8;">Loading live database...</p>
    </div>

    <div class="legend">
        <div class="legend-item"><div class="legend-box" style="background: #e2e8f0;"></div> Available</div>
        <div class="legend-item"><div class="legend-box" style="background: #fbbf24;"></div> Processing</div>
        <div class="legend-item"><div class="legend-box" style="background: #475569;"></div> Booked</div>
    </div>

    <!-- Details Modal -->
    <div class="modal" id="detailsModal">
        <div class="modal-content">
            <h3>Booking Seat <span id="displaySeatNumber"></span></h3>
            <span id="timer">05:00</span>
            <input type="text" id="userName" placeholder="Full Name (e.g. Aniruddha)" required autocomplete="off">
            <input type="tel" id="userPhone" placeholder="Mobile Number" required autocomplete="off">
            <button class="btn" onclick="openPaymentModal(event)">Proceed to Payment</button>
        </div>
    </div>

    <!-- Payment Modal (REAL UPI LINK & UTR CHECK) -->
    <div class="modal" id="paymentModal">
        <div class="modal-content">
            <h3>Scan or Tap to Pay ₹5</h3>
            <a href="upi://pay?pa=walavalkaraniruddha@okaxis&pn=Aniruddha&am=5.00&cu=INR" target="_blank">
                <img src="WhatsApp Image 2026-09-09 at 5.33.54 PM.jpeg" alt="QR Code" class="qr-img">
            </a>
            <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 0;">Tap image to open GPay. After paying, enter the Reference Number below.</p>
            
            <!-- UTR Input Field -->
            <input type="number" id="utrNumber" placeholder="Enter 12-digit UPI Ref No." required autocomplete="off" style="text-align: center;">
            
            <button class="btn" id="verifyBtn" onclick="processBackendPayment()">Verify & Complete</button>
            <p id="message" style="margin-top: 15px; font-weight: bold; font-size: 1.1rem;"></p>
        </div>
    </div>

    <script>
        let currentSeatId = null;
        let timeLeft = 300; 
        let timerInterval;

        // Fetches data directly from your Aiven MySQL database on load
        async function loadSeats() {
            try {
                const res = await fetch('/api/seats');
                const seats = await res.json();
                
                const map = document.getElementById('seat-map');
                map.innerHTML = ''; 

                seats.forEach(seat => {
                    const btn = document.createElement('button');
                    btn.className = `seat ${seat.status.toLowerCase()}`; 
                    
                    if(seat.status === 'AVAILABLE') {
                        btn.innerText = seat.id;
                        btn.onclick = () => openDetailsModal(seat.id);
                    } else if (seat.status === 'PENDING') {
                        btn.innerText = "⏳";
                        btn.disabled = true;
                    } else {
                        btn.innerText = "X";
                        btn.disabled = true;
                    }
                    map.appendChild(btn);
                });
            } catch (error) {
                document.getElementById('seat-map').innerHTML = "<p>Database Connection Error</p>";
            }
        }

        window.onload = loadSeats;

        function startTimer() {
            timerInterval = setInterval(async () => {
                timeLeft--;
                let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
                let s = (timeLeft % 60).toString().padStart(2, '0');
                document.getElementById('timer').innerText = `${m}:${s}`;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    await fetch('/release-seat', { 
                        method: 'POST', 
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ seatId: currentSeatId }) 
                    });
                    alert("Time expired! Your seat has been released.");
                    location.reload();
                }
            }, 1000);
        }

        function openDetailsModal(seatId) {
            currentSeatId = seatId;
            document.getElementById('displaySeatNumber').innerText = seatId;
            document.getElementById('detailsModal').style.display = 'flex';
            if(!timerInterval) startTimer();
        }

        async function openPaymentModal(event) {
            const name = document.getElementById('userName').value;
            if(!name) return alert('Please enter your name');

            const btn = event.target;
            btn.innerText = "Locking Seat in Database...";
            btn.disabled = true;

            try {
                const res = await fetch('/hold-seat', { 
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ seatId: currentSeatId })
                });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('detailsModal').style.display = 'none';
                    document.getElementById('paymentModal').style.display = 'flex';
                    loadSeats(); // Instantly turns the seat Yellow in the background
                } else {
                    alert(data.message);
                    location.reload(); 
                }
            } catch (err) {
                alert("Server error");
                btn.innerText = "Proceed to Payment";
                btn.disabled = false;
            }
        }

        async function processBackendPayment() {
            // UTR Verification Check
            const utr = document.getElementById('utrNumber').value;
            if(!utr || utr.length < 10) {
                alert("Payment Verification Failed! Please enter a valid UPI Reference Number from GPay.");
                return;
            }

            const btn = document.getElementById('verifyBtn');
            const msg = document.getElementById('message');
            btn.innerText = "Verifying UTR with Bank...";
            btn.disabled = true;

            try {
                const res = await fetch('/book-seat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ seatId: currentSeatId, name: document.getElementById('userName').value })
                });
                const data = await res.json();

                if(data.success) {
                    msg.style.color = "#22c55e"; 
                    msg.innerText = "✅ " + data.message;
                    setTimeout(() => location.reload(), 3000);
                } else {
                    msg.style.color = "#ef4444"; 
                    msg.innerText = "❌ " + data.message;
                    btn.innerText = "Booking Closed";
                }
            } catch (err) {
                msg.style.color = "#ef4444";
                msg.innerText = "Server Error. Try again.";
                btn.innerText = "Verify & Complete";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
